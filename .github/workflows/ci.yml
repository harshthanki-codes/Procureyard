name: CI & Policy Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

      - name: Run Full 24-Scenario Evaluation Benchmark
        env:
          PYTHONPATH: .
          PAYSWIFT_BASE_URL: http://localhost:8081
          DATABASE_URL: sqlite+aiosqlite:///./ci_quickdrop.db
        run: |
          python payswift/server.pyc &
          sleep 2
          python -m uvicorn app.main:app --port 8000 &
          sleep 4
          python evals/run.py http://localhost:8000
